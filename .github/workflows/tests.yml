name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Fully offline: no API keys, so the rule agent, phrasebook and mock rides are used.
      - run: python -m pytest -q
      - name: Chaos eval (rules agent vs typical rider, 100 trips)
        run: python -m tripowner.sim.eval --trips 100 --seed 42 --out results/ci_eval.json
